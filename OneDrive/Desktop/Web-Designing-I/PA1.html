<!DOCTYPE html>
<html lang="en">
<head>
    <title>College TimeTable</title>
</head>
<body>
    <h1>College TimeTable</h1>
    <table border="1" height="200" width="400">
        <tr align="center">
            <th>Time</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
        </tr align="center">
        <tr align="center">
            <td>Monday</td>
            <td>HTML</td>
            <td rowspan="2">HTML Lab</td>
            <td>Mathematics</td>
        </tr>
        <tr align="center">
            <td>Tuesday</td>
            <td>CSS</td>
            <td>English</td>
        </tr>
        <tr align="center">
            <td>Wednesday</td>
            <td>JavaScript</td>
            <td>Mathematics</td>
            <td>Physics</td>
        </tr>
        <tr align="center">
            <td colspan="4">Lectures Summary</td>
        </tr>
        <tr align="center">
            <td colspan="2">HTML</td>
            <td colspan="2">1 Lecture</td>
        </tr>
        <tr align="center">
            <td colspan="2">CSS</td>
            <td colspan="2">1 Lecture</td>
        </tr>
    </table>
</body>
</html>
