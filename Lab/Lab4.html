<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Room Booking Form</title>
</head>
<body>
    <form action="thank_you.html" method="get" name="hotel_booking">
        <fieldset>
            <center>
                <h3>Hotel Room Booking Form</h3>
                <label for="name">Name:</label>
                <input type="text" id="name" name="username" placeholder="Enter your name" minlength="4" required>

                <br/>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="johndoe@example.com" minlength="10" required>

                <br/>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="9180808040" minlength="10" required>

                <br/>
                <label for="checkin">Check-In Date:</label>
                <input type="date" id="checkin" name="checkin_date" required>

                <br/>
                <label for="checkout">Check-Out Date:</label>
                <input type="date" id="checkout" name="checkout_date" required>

                <br/>
                <label for="room_type">Room Type:</label>
                <select id="room_type" name="room_type">
                    <option value="Select Room Type"></option>
                    <option value="single">Single</option>
                    <option value="double">Double</option>
                    <option value="suite">Suite</option>
                </select>

                <br/>
                <label for="guests">Number Of Guests</label>
                <input type="number" id="guests" name="guests" min="1" max="10" required>

                <br/>
                <label for="special_requests">Special Request</label>
                <br/>
                <textarea id="special_requests" name="special_requests"></textarea>

                <br/>
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    Terms and Conditions
                </label>

                <br>
                <input type="submit" value="Book Now">
                <input type="reset" value="Reset Form">
            </center>
        </fieldset>
</form>
</body>
</html>
