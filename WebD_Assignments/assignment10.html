<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 10 - Multimedia</title>
</head>
<body>
    <h2>Image</h2>
    <img src="photo.svg" alt="Sample image" width="300">

    <h2>Video</h2>
    <video width="400" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Audio</h2>
    <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <h2>YouTube Video</h2>
    <iframe width="400" height="250" src="https://www.youtube.com/embed/UB1O30fR-EE" title="YouTube video" allowfullscreen></iframe>
</body>
</html>
