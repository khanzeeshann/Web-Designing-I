<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Block and Inline Elements</title>
</head>
<body>
    <h2>Block Elements (start on a new line, take full width)</h2>
    <div style="background-color: lightblue;">This is a div.</div>
    <p style="background-color: lightgreen;">This is a paragraph.</p>
    <h3 style="background-color: lightyellow;">This is a heading.</h3>

    <h2>Inline Elements (stay in the same line)</h2>
    <p>
        <span style="background-color: orange;">Span one</span>
        <span style="background-color: pink;">Span two</span>
        <a href="#">A link</a>
        <b>Bold</b>
        <i>Italic</i>
    </p>
</body>
</html>
