<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Page</title>
</head>
<body>
    <header>
        <h1>ABES Engineering College</h1>
        <nav aria-label="Main navigation">
            <a href="#form-section">Admission Form</a> |
            <a href="#courses">Courses</a>
        </nav>
    </header>

    <main>
        <section id="courses">
            <h2>Courses Offered</h2>
            <ul>
                <li>B.Tech CSE</li>
                <li>B.Tech CSE-DS</li>
                <li>B.Tech IT</li>
            </ul>
        </section>

        <section id="form-section">
            <h2>Student Admission Form</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="fname">Full Name:</label>
                    <input type="text" id="fname" name="fname" required><br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" required><br><br>

                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required><br><br>

                    Gender:
                    <input type="radio" id="m" name="gender" value="male" required>
                    <label for="m">Male</label>
                    <input type="radio" id="f" name="gender" value="female">
                    <label for="f">Female</label><br><br>

                    <label for="address">Address:</label><br>
                    <textarea id="address" name="address" rows="3" cols="40"></textarea>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Course Details</legend>

                    <label for="course">Course:</label>
                    <select id="course" name="course" required>
                        <option value="">--Select--</option>
                        <option>CSE</option>
                        <option>CSE-DS</option>
                        <option>IT</option>
                    </select><br><br>

                    <label for="marks">12th Percentage:</label>
                    <input type="number" id="marks" name="marks" min="0" max="100" required><br><br>

                    <label for="photo">Upload Photo:</label>
                    <input type="file" id="photo" name="photo"><br><br>

                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">I confirm that the above details are correct.</label>
                </fieldset>
                <br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Zeeshan Khan</p>
    </footer>
</body>
</html>
